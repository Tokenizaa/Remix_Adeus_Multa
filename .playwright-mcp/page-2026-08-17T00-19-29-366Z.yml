                  - generic [ref=f14e560]: Questão submetida a julgamento
                  - generic [ref=f14e561]: Questão referente ao percentual de juros moratórios devido nas condenações impostas à Fazenda Pública para pagamento de verbas remuneratórias a servidores públicos, nos termos do artigo 1º-F da Lei nº 9.494/97, acrescentado pela Medida Provisória nº 2.180/2001.
                - generic [ref=f14e563]:
                  - generic [ref=f14e564]: Tese Firmada
                  - generic [ref=f14e565]: O art. 1º-F, da Lei 9.494/97, que fixa os juros moratórios nas ações ajuizadas contra a Fazenda Pública no patamar de 6%, é de ser aplicado tão somente às demandas ajuizadas após a sua entrada em vigor.
                - generic [ref=f14e567]:
                  - generic [ref=f14e568]: Anotações NUGEPNAC
                  - generic [ref=f14e569]: RRC de Origem (art. 543-C, §1º, do CPC/73). São devidos juros moratórios de 6% ao ano em condenação imposta à Fazenda Pública, cuja ação foi ajuizada após a entrada em vigor do art. 1º-F da Lei 9.494/1997.
                - generic [ref=f14e572]:
                  - generic [ref=f14e573]: Delimitação do Julgado
                  - generic [ref=f14e574]: "\"O debate sobre a cisão dos juros moratórios, quando a ação tiver sido ajuizada em data anterior à entrada em vigor do art. 1º-F da Lei n. 9.494/97 não foi objeto do recurso especial. (...) Nada impede, portanto, que a União diligencie no sentido de ver analisada tal tese em recurso próprio, que tenha por objeto ação ajuizada anteriormente à vigência do artigo\"."
                - generic [ref=f14e576]:
                  - generic [ref=f14e577]: Entendimento Anterior
                  - generic [ref=f14e578]: Cessam os efeitos previstos no artigo 543-C do CPC em relação ao Recurso Especial Repetitivo n. 1.086.944/SP, que se referia tão-somente às modificações legislativas impostas pela MP 2.180-35/01, que acrescentou o art. 1º-F à Lei 9.494/97, alterada pela Lei 11.960/09, aqui tratada. (Recurso Repetitivo no REsp 1.205.946/SP)
                - generic [ref=f14e580]:
                  - generic [ref=f14e581]: Repercussão Geral
                  - generic [ref=f14e582]: Tema 435/STF - Aplicação do artigo 1º-F da Lei 9.494/97 nas ações ajuizadas anteriormente à sua vigência.
