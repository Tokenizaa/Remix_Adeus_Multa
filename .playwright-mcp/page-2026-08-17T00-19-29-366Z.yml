                  - generic [ref=f14e668]: Na hipótese em que se pretende a revisão de ato de reforma de policial militar do Estado do Rio Grande do Sul, com base na Lei Complementar Estadual nº 10.990/97, com sua promoção a um posto superior na carreira militar e, como mera consequência do deferimento do pedido de promoção, a revisão de seus proventos da inatividade, a prescrição aplicável é de fundo do direito, nos termos do artigo 1º do Decreto nº 20.910/32.
